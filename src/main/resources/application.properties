spring.application.name=Falcon POS

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:5782}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# =========================================================
# LOGGING
# =========================================================
logging.level.root=INFO
logging.file.name=${FALCON_LOG_FILE:error.log}

# =========================================================
# DATABASE - SUPABASE POSTGRESQL
# =========================================================
spring.datasource.url=${FALCON_DB_URL}
spring.datasource.username=${FALCON_DB_USERNAME}
spring.datasource.password=${FALCON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SESSION
# =========================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# =========================================================
# EMAIL VERIFICATION
# =========================================================
falcon.mail.delivery=${FALCON_MAIL_DELIVERY:log}
falcon.mail.from=${FALCON_MAIL_FROM:no-reply@falcon-pos.local}

# =========================================================
# BREVO SMTP
# =========================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-part-count=100

falcon.upload.root-directory=${FALCON_UPLOAD_ROOT:${user.dir}/uploads}