<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category List | Falcon POS</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/pages/dashboard-shell.css}"><link rel="stylesheet" th:href="@{/css/pages/catalog-management.css}">
<link rel="stylesheet" th:href="@{/css/pages/product-ui.css}"><link rel="stylesheet" th:href="@{/css/print.css}" media="print"></head>
<body class="dashboard-body product-ui"><div class="app-shell" data-app-shell><aside th:replace="~{fragments/settings-shell :: sidebar('products')}"></aside>
<button class="sidebar-scrim" type="button" data-sidebar-close aria-label="Close navigation"></button><div class="workspace"><header th:replace="~{fragments/settings-shell :: topbar('Products')}"></header><main class="catalog-page">
<div th:replace="~{fragments/product-ui :: nav('categories')}"></div>
<section class="catalog-heading"><div><span class="eyebrow">Product catalogue</span><h1>Category List</h1><p>Saved product categories and their current usage.</p></div><div class="catalog-heading-actions"><a class="catalog-btn primary" th:href="@{/owner/products/categories/new}">+ Add Category</a></div></section>
<div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
<section class="catalog-card"><form class="toolbar" method="get" th:action="@{/owner/products/categories}" data-product-filters><div class="toolbar-search"><input name="q" th:value="${query}" placeholder="Search category name or slug"></div><select name="status"><option value="">All statuses</option><option value="ACTIVE" th:selected="${selectedStatus != null and selectedStatus.name() == 'ACTIVE'}">Active</option><option value="INACTIVE" th:selected="${selectedStatus != null and selectedStatus.name() == 'INACTIVE'}">Inactive</option></select><select name="archived" data-advanced-filter><option value="false" th:selected="${!selectedArchived}">Active records</option><option value="true" th:selected="${selectedArchived}">Archived records</option></select><select name="sortBy" data-advanced-filter><option value="displayOrder" th:selected="${selectedSort=='displayOrder'}">Sort: Display order</option><option value="name" th:selected="${selectedSort=='name'}">Sort: Name</option><option value="createdAt" th:selected="${selectedSort=='createdAt'}">Sort: Created date</option><option value="status" th:selected="${selectedSort=='status'}">Sort: Status</option></select><select name="sortDir" data-advanced-filter><option value="asc" th:selected="${selectedDirection=='asc'}">Ascending</option><option value="desc" th:selected="${selectedDirection=='desc'}">Descending</option></select><select name="size" data-advanced-filter><option th:each="option:${pageSizes}" th:value="${option}" th:text="${option}" th:selected="${option==selectedSize}">10</option></select><button class="export-btn">Apply</button><div class="toolbar-spacer"></div><div class="export-group"><a class="export-btn" th:href="@{/owner/products/categories/export(format='xlsx',q=${query},status=${selectedStatus},archived=${selectedArchived})}">Excel</a><a class="export-btn" th:href="@{/owner/products/categories/export(format='csv',q=${query},status=${selectedStatus},archived=${selectedArchived})}">CSV</a><a class="export-btn" th:href="@{/owner/products/categories/export(format='pdf',q=${query},status=${selectedStatus},archived=${selectedArchived})}">PDF</a><button class="export-btn" type="button" onclick="window.print()">Print</button></div></form>
<div class="table-wrap"><table class="catalog-table category-table"><thead><tr><th>ID</th><th>Name</th><th>Total Products</th><th>Display Order</th><th>Status</th><th>Creation Date</th><th class="no-export">Actions</th></tr></thead><tbody><tr th:each="category:${categoryRows}"><td th:text="${category.id}">1</td><td th:text="${category.name}">Name</td><td th:text="${category.totalProducts}">0</td><td th:text="${category.displayOrder}">0</td><td th:text="${category.archived?'Archived':category.status}">Active</td><td th:text="${#temporals.format(category.createdAt,'dd MMM yyyy')}">Date</td><td class="no-export"><a class="table-action" th:href="@{/owner/products/categories/{id}(id=${category.id})}">View</a> <a class="table-action" th:if="${!category.archived}" th:href="@{/owner/products/categories/{id}/edit(id=${category.id})}">Edit</a><form class="inline-form" th:if="${!category.archived}" th:action="@{/owner/products/categories/{id}/archive(id=${category.id})}" method="post" data-confirm-message="Archive this category? Its record and product history will be preserved."><button class="table-action danger" type="submit">Archive</button></form><form class="inline-form" th:if="${category.archived}" th:action="@{/owner/products/categories/{id}/restore(id=${category.id})}" method="post"><button class="table-action" type="submit">Restore</button></form></td></tr><tr th:if="${#lists.isEmpty(categoryRows)}"><td colspan="7" class="table-empty">No category records.</td></tr></tbody></table></div>
<div class="table-foot"><span th:text="|${categoryPage.totalElements} record(s)|">0 records</span><div class="pagination"><a th:if="${categoryPage.hasPrevious()}" th:href="@{/owner/products/categories(page=${categoryPage.number-1},size=${selectedSize},q=${query},status=${selectedStatus},archived=${selectedArchived},sortBy=${selectedSort},sortDir=${selectedDirection})}">Previous</a><span th:text="|Page ${categoryPage.number+1} of ${categoryPage.totalPages==0?1:categoryPage.totalPages}|">Page 1</span><a th:if="${categoryPage.hasNext()}" th:href="@{/owner/products/categories(page=${categoryPage.number+1},size=${selectedSize},q=${query},status=${selectedStatus},archived=${selectedArchived},sortBy=${selectedSort},sortDir=${selectedDirection})}">Next</a></div></div></section>
</main></div></div><script th:src="@{/js/pages/dashboard-shell.js}" defer></script><script th:src="@{/js/pages/product-ui.js}" defer></script>
</body></html>
