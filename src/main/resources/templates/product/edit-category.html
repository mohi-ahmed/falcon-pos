<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Category | Falcon POS</title><link rel="stylesheet" th:href="@{/css/base.css}"><link rel="stylesheet" th:href="@{/css/components.css}"><link rel="stylesheet" th:href="@{/css/pages/dashboard-shell.css}"><link rel="stylesheet" th:href="@{/css/pages/catalog-management.css}">
<link rel="stylesheet" th:href="@{/css/pages/product-ui.css}"></head><body class="dashboard-body product-ui"><div class="app-shell" data-app-shell><aside th:replace="~{fragments/settings-shell :: sidebar('products')}"></aside>
<button class="sidebar-scrim" type="button" data-sidebar-close aria-label="Close navigation"></button><div class="workspace"><header th:replace="~{fragments/settings-shell :: topbar('Products')}"></header><main class="catalog-page">
<div th:replace="~{fragments/product-ui :: nav('categories')}"></div><section class="catalog-heading"><div><span class="eyebrow">Product catalogue</span><h1>Edit Category</h1></div></section><form class="catalog-card" th:action="@{/owner/products/categories/{id}(id=${category.id})}" th:object="${categoryRequest}" method="post" enctype="multipart/form-data">
<div class="validation-summary" th:if="${#fields.hasAnyErrors()}" role="alert"><strong>Check the category information</strong><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div><div class="catalog-card-body form-grid"><div class="form-field"><label>Name *</label><input th:field="*{name}" required maxlength="120" data-category-name><small class="field-error" th:errors="*{name}"></small></div><div class="form-field"><label>Slug</label><input th:field="*{slug}" maxlength="140" data-category-slug><small class="field-error" th:errors="*{slug}"></small></div><div class="form-field"><label>Parent</label><select th:field="*{parentCategoryId}"><option value="">No parent</option><option th:each="item:${categories}" th:value="${item.id}" th:text="${item.name}"></option></select></div><div class="form-field"><label>Status</label><select th:field="*{status}"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div><div class="form-field"><label>Display order</label><input type="number" min="0" th:field="*{displayOrder}"></div><div class="form-field"><label>Replace thumbnail</label><input type="file" name="categoryImageFile" accept="image/jpeg,image/png,image/webp"><small class="form-hint">JPG, PNG or WebP; maximum 5 MB.</small></div><div class="form-field full"><label>Thumbnail URL/reference</label><input th:field="*{thumbnailReference}" maxlength="500"></div><div class="form-field full"><label>Assigned branches *</label><div class="branch-chip-row"><label class="branch-chip" th:each="branch:${branches}"><input type="checkbox" th:field="*{branchIds}" th:value="${branch.id}"><span th:text="${branch.name}"></span></label></div></div><div class="form-field full"><label>Description</label><textarea th:field="*{description}" maxlength="1000"></textarea></div></div><div class="sticky-form-actions"><a class="catalog-btn" th:href="@{/owner/products/categories/{id}(id=${category.id})}">Cancel</a><button class="catalog-btn primary" type="submit">Update Category</button></div></form></main></div></div><script th:src="@{/js/pages/product-ui.js}" defer></script>
<script th:src="@{/js/pages/dashboard-shell.js}" defer></script>
</body></html>
