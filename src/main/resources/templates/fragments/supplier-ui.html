<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="feedback" class="supplier-feedback" aria-live="polite" aria-atomic="true">
    <div class="catalog-toast-region" th:if="${successMessage}">
        <div class="catalog-toast catalog-toast-success" role="status" data-auto-dismiss-toast>
            <span class="catalog-toast-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" focusable="false" aria-hidden="true">
                    <path d="M7.9 13.7 4.6 10.4l1.3-1.3 2 2 5.9-5.9 1.3 1.3-7.2 7.2Z"></path>
                </svg>
            </span>
            <span class="catalog-toast-message" th:text="${successMessage}">Supplier added successfully.</span>
            <button class="catalog-toast-close" type="button" data-toast-close aria-label="Dismiss notification">
                <svg viewBox="0 0 20 20" focusable="false" aria-hidden="true">
                    <path d="m5.8 4.5 4.2 4.2 4.2-4.2 1.3 1.3-4.2 4.2 4.2 4.2-1.3 1.3-4.2-4.2-4.2 4.2-1.3-1.3L8.7 10 4.5 5.8l1.3-1.3Z"></path>
                </svg>
            </button>
            <span class="catalog-toast-progress" aria-hidden="true"></span>
        </div>
    </div>
    <div class="flash-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
</div>
</body>
</html>
